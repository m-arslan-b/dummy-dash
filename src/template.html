<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nano Lens Portfolio Pulse</title>
<style>
:root{
  color-scheme:light;
  --bg1:#f7f9e9;--bg2:#e3eee6;--panel:#ffffff;
  --ink:#16241b;--ink2:#4b5a50;--muted:#7b887f;--grid:#e4eadf;--axis:#c3cfc2;--line:#dbe4d6;
  --pill:#e9edae;--pill-ink:#2a3517;--menu:#dfeadb;--accent:#1f6b4a;
  --row-a:#f8fadf;--row-b:#f0f4cc;--row-hover:#e4ecab;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#8b6ad6;
  --good:#0ca30c;--goodtext:#0a6e0a;--bad:#d03b3b;--badtext:#b02a2a;
  --t0:#f4f9fa;--t1:#d7eaee;--t2:#a6ccd5;--t3:#6ea6b3;--t4:#3b7d8c;
  --h0:#fdeee3;--h1:#f9cdb0;--h2:#f1a074;--h3:#e0703d;--h4:#b3441a;
  --b0:#e3effc;--b1:#b7d3f6;--b2:#6da7ec;--b3:#2a78d6;--b4:#184f95;
  --shadow:0 1px 2px rgba(30,60,40,.06),0 10px 28px rgba(40,80,50,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg1);background-image:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{padding:16px 22px 28px;max-width:1700px;margin:0 auto}
.nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:12px}
.logo{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 210deg,#ffb27a,#e87ba4,#6da7ec,#1baf7a,#ffb27a);display:grid;place-items:center}
.logo i{display:block;width:18px;height:18px;border-radius:50%;background:var(--bg1)}
.brand b{font-size:21px;letter-spacing:.2px;display:block;line-height:1.1}.brand small{color:var(--muted);font-size:11.5px}
.tabs{display:flex;gap:12px;flex-wrap:wrap}
.tab{border:2px solid transparent;background:var(--pill);color:var(--pill-ink);border-radius:999px;padding:11px 30px;font-size:17px;font-weight:700;box-shadow:var(--shadow);min-width:170px}
.tab:hover{filter:brightness(.97)}
.tab[aria-selected="true"]{background:#fff;border-color:var(--accent);color:var(--ink)}
.asof{margin-left:auto;font-size:13px;color:var(--ink2);text-align:right}.asof b{color:var(--ink)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.rail{display:flex;flex-direction:column;gap:8px;position:sticky;top:12px}
.menu{display:flex;flex-direction:column;gap:7px}
.mi{border:1px solid var(--line);background:var(--menu);border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:650;text-align:left;color:var(--ink2)}
.mi:hover{background:#d3e2cd}
.mi[aria-selected="true"]{background:#fff;color:var(--ink);border-color:var(--accent);box-shadow:var(--shadow)}
.krow{display:flex;flex-direction:column;gap:6px}.kg{display:flex;flex-direction:column;gap:3px;min-width:0}
.kh{font-size:12px;font-weight:700;color:var(--ink2);margin:6px 4px 0;letter-spacing:.02em}
.kb{background:linear-gradient(180deg,#fff,#eef5e2);border:1px solid var(--line);border-radius:24px;padding:10px 14px;box-shadow:var(--shadow)}
.kb .v{overflow-wrap:anywhere;font-size:23px;font-weight:750;letter-spacing:-.01em;line-height:1.15}
.kb .v2{font-size:14px;color:var(--ink2);margin-top:1px}
.panel{background:var(--panel);border-radius:30px;padding:16px 20px 18px;box-shadow:var(--shadow);min-width:0;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding-bottom:12px;border-bottom:1px solid var(--grid)}
.f{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.f select,.f input{border:1px solid var(--axis);background:#fff;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:500;min-width:112px;color:var(--ink)}
.f .pair{display:flex;gap:6px;align-items:center}.f .pair input{min-width:0;width:128px}
.fbtn{border:1px solid var(--axis);background:#fff;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:650}
.fbtn:hover{background:var(--row-a)}
.fbtn.dl{border-color:var(--accent);color:var(--accent)}
.f[hidden]{display:none}
.fgrow{margin-left:auto;display:flex;gap:8px;align-items:flex-end}
.vhead{padding:14px 2px 10px}.vhead h2{margin:0;font-size:21px;letter-spacing:-.01em}.vhead p{margin:3px 0 0;color:var(--ink2);font-size:13.5px;max-width:80ch}
.vbody{min-width:0}
.tw{overflow:auto;max-height:calc(100vh - 360px);min-height:300px;border:1px solid var(--grid);border-radius:14px}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.t th{position:sticky;top:0;background:#fff;color:var(--ink);font-weight:700;padding:8px 10px;text-align:right;border-bottom:2px solid var(--axis);z-index:2;line-height:1.2}
.t th:first-child,.t td:first-child{text-align:left;position:sticky;left:0;z-index:1}
.t th:first-child{z-index:3}
.t td{padding:5px 10px;text-align:right;border-bottom:1px solid #e8eed2}
.t tbody tr:nth-child(odd) td{background:var(--row-a)}.t tbody tr:nth-child(even) td{background:var(--row-b)}
.t tbody tr:hover td{background:var(--row-hover)}
.t td:first-child{font-weight:600;background:inherit}
.t tbody tr.z td{color:var(--muted)}
.t tfoot td{position:sticky;bottom:0;background:#fff!important;font-weight:800;border-top:2px solid var(--axis);z-index:2}
.t td.hl{color:#0e2a31}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2 .wide{grid-column:1/-1}
.cc{border:1px solid var(--grid);border-radius:18px;padding:12px 14px;min-width:0;background:#fff}
.cc h4{margin:0;font-size:14.5px}.cc p{margin:2px 0 6px;font-size:12.5px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:9px;overflow:hidden;margin-left:8px;vertical-align:middle}
.seg button{background:#fff;border:0;padding:3px 10px;font-size:12px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.plot{position:relative;min-width:0}
.plot svg{display:block;max-width:100%;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.legend i.ln{height:3px;width:16px;border-radius:2px}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.empty{display:grid;place-items:center;min-height:150px;color:var(--ink2);font-size:13.5px;text-align:center;padding:10px}
.hot{cursor:pointer}
.dim{opacity:.35}
#tip{position:fixed;z-index:50;pointer-events:none;background:#fff;color:var(--ink);border:1px solid var(--axis);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(20,50,30,.2);opacity:0;transition:opacity .08s;max-width:270px;line-height:1.35}
#tip.on{opacity:1}#tip .v{font-size:14px;font-weight:700}#tip .k{color:var(--ink2)}
#tip .r{display:flex;gap:7px;align-items:center;margin-top:2px}#tip .r i{display:inline-block;width:12px;height:3px;border-radius:2px;flex:none}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
svg text{font-family:inherit}
@media (max-width:1100px){.shell{grid-template-columns:1fr}.rail{position:static}.menu{flex-direction:row;overflow-x:auto;padding-bottom:4px}.mi{white-space:nowrap;flex:none}.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.grid2{grid-template-columns:1fr}.asof{margin-left:0;text-align:left}}
@media (max-width:640px){.app{padding:12px 14px 24px}.tab{min-width:0;flex:1;padding:10px 12px;font-size:15px}.panel{border-radius:22px;padding:12px 12px 14px}.f select,.f input{min-width:96px}.f .pair input{width:118px}.fgrow{margin-left:0}}
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <div class="brand"><div class="logo"><i></i></div><div><b>Nano Lens</b><small>Islamic finance · loan book</small></div></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Dashboard sections"></div>
    <div class="asof">Data as of <b>08 Jul 2026</b><br><span id="rowTxt"></span></div>
  </div>
  <div class="shell">
    <aside class="rail" aria-label="Views and key figures">
      <nav class="menu" id="menu" role="tablist" aria-label="Views"></nav>
      <div class="krow" id="kpis"></div>
    </aside>
    <section class="panel">
      <div class="filters" id="filters"></div>
      <div class="vhead"><h2 id="vt"></h2><p id="vd"></p></div>
      <div class="vbody" id="view"></div>
    </section>
  </div>
</div>
<div id="tip" role="tooltip"></div>
<script>
const RAW=/*__DATA__*/null;
(function(){
"use strict";
/* ---------- data ---------- */
const N=RAW.n,ASOF=RAW.asof,NDAY=ASOF;
function dec(k,T){const b=atob(RAW.c[k]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return T===Uint8Array?u:new T(u.buffer);}
const day=dec('day',Uint8Array),hour=dec('hour',Uint8Array),st=dec('st',Uint8Array),dpd=dec('dpd',Uint8Array),amt=dec('amt',Uint16Array),
term=dec('term',Uint8Array),ten=dec('ten',Uint8Array),fl=dec('fl',Uint8Array),profit=dec('profit',Uint16Array),repay=dec('repay',Uint32Array),
rec=dec('rec',Uint32Array),due=dec('due',Uint8Array),disb=dec('disb',Uint16Array),paid=dec('paid',Uint8Array),lagh=dec('lagh',Uint8Array),dpdd=dec('dpdd',Uint8Array);
const aB=new Uint8Array(N),tB=new Uint8Array(N),nB=new Uint8Array(N),fB=new Uint8Array(N);
const FB=21;
for(let i=0;i<N;i++){const a=amt[i];aB[i]=a<5000?0:a<10000?1:a<20000?2:a<30000?3:4;fB[i]=Math.min(FB-1,Math.max(0,Math.floor((a-1)/2000)));
 const t=term[i];tB[i]=t<=18?0:t<=24?1:t<=30?2:3;const n=ten[i];nB[i]=n<=1?0:n<=3?1:n<=7?2:n<=15?3:4;}
const D0=Date.UTC(2026,3,13),MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dDate=i=>new Date(D0+i*864e5),dFmt=i=>{const d=dDate(i);return String(d.getUTCDate()).padStart(2,'0')+' '+MON[d.getUTCMonth()];};
const dIso=i=>dDate(i).toISOString().slice(0,10),isoDay=s=>Math.round((Date.parse(s+'T00:00:00Z')-D0)/864e5);
const L={st:['Active','In arrears','Closed'],dpd:['DPD 0','DPD 7','DPD 15','DPD 21','DPD 30','DPD 30+'],amt:['<5K','5–10K','10–20K','20–30K','30K+'],
 term:['≤18 days','19–24 days','25–30 days','31+ days'],ten:['1st loan','2–3 loans','4–7 loans','8–15 loans','16+ loans']};
const fLab=k=>k===FB-1?'40,001+':((k*2000+1).toLocaleString('en-US')+'–'+((k+1)*2000).toLocaleString('en-US'));
/* ---------- helpers ---------- */
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const num=n=>Math.round(n).toLocaleString('en-US');
const money=n=>{const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e6?(n/1e6).toFixed(a>=1e8?0:1)+'M':a>=1e3?(n/1e3).toFixed(a>=1e5?0:1)+'K':String(Math.round(n));};
const pc=(x,d=1)=>x==null||!isFinite(x)?'–':(x*100).toFixed(d)+'%';
const div=(a,b)=>b>0?a/b:null;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const hex=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
function ramp(names,t){const s=names.map(n=>hex(css(n)));t=Math.max(0,Math.min(1,t))*(s.length-1);const i=Math.min(Math.floor(t),s.length-2),f=t-i;return s[i].map((v,k)=>Math.round(v+(s[i+1][k]-v)*f));}
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`,lum=c=>(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;
const TEAL=['--t0','--t1','--t2','--t3','--t4'],HEAT=['--h0','--h1','--h2','--h3','--h4'],BLU=['--b0','--b1','--b2','--b3','--b4'];
function scale(v){if(!(v>0))return{max:1,step:.25};const raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,s=(f<=1?1:f<=2?2:f<=5?5:10)*p;return{max:Math.ceil(v/s-1e-9)*s,step:s};}
function ticks(max){const s=scale(max).step,o=[];for(let t=0;t<=max+s*1e-6;t+=s)o.push(t);return o;}
const tipEl=document.getElementById('tip');
const ta=h=>' data-tip="'+esc(h)+'"';
const trow=(c,k,v)=>`<div class="r"><i style="background:${c}"></i><span class="v">${v}</span> <span class="k">${k}</span></div>`;
function showTip(h,x,y){tipEl.innerHTML=h;tipEl.classList.add('on');const r=tipEl.getBoundingClientRect();let l=x+14,t=y+14;if(l+r.width>innerWidth-8)l=x-r.width-14;if(t+r.height>innerHeight-8)t=y-r.height-14;tipEl.style.left=Math.max(6,l)+'px';tipEl.style.top=Math.max(6,t)+'px';}
const hideTip=()=>tipEl.classList.remove('on');
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&t.dataset.tip)showTip(t.dataset.tip,e.clientX,e.clientY);else if(!e.target.closest||!e.target.closest('[data-live]'))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t){const r=t.getBoundingClientRect();showTip(t.dataset.tip,r.left+r.width/2,r.top);}});
document.addEventListener('focusout',hideTip);
const vw=el=>Math.max(260,el.clientWidth||300);
const emptyHtml=m=>'<div class="empty">'+(m||'No loans match the current filters.')+'</div>';
function legendHtml(items){return '<div class="legend">'+items.map(i=>`<span><i class="${i.ln?'ln':''}" style="background:${i.c}"></i>${i.t}</span>`).join('')+'</div>';}
const keyAct=(n,f)=>{n.onclick=f;n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};};
/* ---------- state & mask ---------- */
const blank=()=>({from:0,to:NDAY-1,pfrom:null,pto:null,term:null,amt:null,ten:null,st:null,dpd:null,slider:null});
let S=blank(),tab='disbursement',viewId={disbursement:'breakdown',recovery:'breakdown',risk:'breakdown'};
let mcache={};
function mask(excl){const ex=new Set(excl||[]),key=[...ex].sort().join('|');if(mcache[key])return mcache[key];
 const m=new Uint8Array(N),f=S,useDate=!ex.has('date'),usePaid=tab==='recovery'&&f.pfrom!=null&&!ex.has('paid');
 const t=ex.has('term')?null:f.term,a=ex.has('amt')?null:f.amt,n=ex.has('ten')?null:f.ten,s=ex.has('st')?null:f.st,d=ex.has('dpd')?null:f.dpd,sl=ex.has('slider')?null:f.slider;
 for(let i=0;i<N;i++){
  if(useDate&&(day[i]<f.from||day[i]>f.to))continue;
  if(usePaid&&(paid[i]===255||paid[i]<f.pfrom||paid[i]>f.pto))continue;
  if(t!==null&&tB[i]!==t)continue;if(a!==null&&aB[i]!==a)continue;if(n!==null&&nB[i]!==n)continue;
  if(s!==null&&st[i]!==s)continue;if(d!==null&&dpd[i]!==d)continue;if(sl!==null&&((fl[i]>>6)&1)!==sl)continue;
  m[i]=1;}
 return mcache[key]=m;}
/* ---------- aggregation ---------- */
const mk=()=>({n:0,disb:0,amt:0,repay:0,profit:0,rec:0,termSum:0,rep:0,slider:0,cool:0,coolPaid:0,fast:0,soldN:0,due:0,repayDue:0,recDue:0,recN:0,timelyN:0,timelyAmt:0,overN:0,overAmt:0,
 nplN:0,nplRepay:0,nplRec:0,nplClosed:0,m7:0,d7:0,m15:0,d15:0,m30:0,d30:0,arrN:0,arrPrin:0,dpd30Prin:0,dpd30N:0,dpdSum:0,dpdN:0});
function accum(g,i){g.n++;g.disb+=disb[i];g.amt+=amt[i];g.repay+=repay[i];g.profit+=profit[i];g.rec+=rec[i];g.termSum+=term[i];
 if(ten[i]>1)g.rep++;const f=fl[i];if((f>>6)&1)g.slider++;
 if(lagh[i]!==255){g.soldN++;if(lagh[i]<=3)g.fast++;}
 if(due[i]<ASOF){g.due++;g.repayDue+=repay[i];g.recDue+=rec[i];if(rec[i]>0)g.recN++;
  if(paid[i]!==255){if(paid[i]<=due[i]){g.timelyN++;g.timelyAmt+=rec[i];}else{g.overN++;g.overAmt+=rec[i];}}}
 if((f>>7)&1){g.cool++;g.coolPaid+=rec[i];}
 if((f>>2)&1){g.nplN++;g.nplRepay+=repay[i];g.nplRec+=rec[i];if(st[i]===2)g.nplClosed++;}
 if((f>>3)&1){g.m7++;g.d7+=f&1;}if((f>>4)&1){g.m15++;g.d15+=(f>>1)&1;}if((f>>5)&1){g.m30++;g.d30+=(f>>2)&1;}
 if(st[i]===1){g.arrN++;g.arrPrin+=amt[i];g.dpdSum+=dpdd[i];g.dpdN++;}
 if(dpd[i]===5){g.dpd30Prin+=amt[i];g.dpd30N++;}}
function group(m,K,key){const a=Array.from({length:K},mk);for(let i=0;i<N;i++)if(m[i]){const k=key(i);if(k>=0&&k<K)accum(a[k],i);}return a;}
function total(m){const g=mk();for(let i=0;i<N;i++)if(m[i])accum(g,i);return g;}
/* ---------- generic table ---------- */
let CSV={head:[],rows:[],name:'export'};
function table(host,labels,aggs,tot,cols,first){
 const mx=cols.map(c=>c.heat?Math.max(1e-12,...aggs.map(g=>{const v=c.v(g);return v==null?0:v;})):1);
 const body=aggs.map((g,r)=>`<tr class="${g.n?'':'z'}"><td>${labels[r]}</td>${cols.map((c,j)=>{const v=c.v(g);let sty='',cls='';
   if(c.heat&&v!=null&&g.n){const col=ramp(c.heat==='o'?HEAT:TEAL,v/mx[j]);sty=` style="background:${rgb(col)}"`;cls=lum(col)<.5?'':' class="hl"';}
   return `<td${sty}${cls}>${v==null?'–':c.f(v)}</td>`;}).join('')}</tr>`).join('');
 const foot=`<tr><td>Total</td>${cols.map(c=>{const v=c.v(tot);return `<td>${v==null?'–':c.f(v)}</td>`;}).join('')}</tr>`;
 host.innerHTML=`<div class="tw"><table class="t"><thead><tr><th>${first}</th>${cols.map(c=>`<th>${c.h}</th>`).join('')}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`;
 CSV.head=[first,...cols.map(c=>c.h.replace(/<br>/g,' '))];
 CSV.rows=[...aggs.map((g,r)=>[labels[r],...cols.map(c=>{const v=c.v(g);return v==null?'':c.f(v).replace(/,/g,'');})]),['Total',...cols.map(c=>{const v=c.v(tot);return v==null?'':c.f(v).replace(/,/g,'');})]];
}
const I=x=>({v:x,f:num}),P=x=>({v:x,f:v=>pc(v)});
/* ---------- generic bars ---------- */
function bars(host,items,o){
 const w=vw(host),h=o.h||260,pl=o.pl||48,pr=8,pt=o.pt||22,pb=o.pb||(o.sub?44:30),SN=o.series.length,stk=o.stacked;
 const tots=items.map(it=>stk?it.v.reduce((a,b)=>a+(b||0),0):Math.max(0,...it.v.map(x=>x||0)));const mxv=Math.max(0,...tots);
 if(!mxv){host.innerHTML=emptyHtml(o.empty);return;}
 const mx=scale(mxv*1.06).max,iw=w-pl-pr,ih=h-pt-pb,n=items.length,gw=iw/n,y=v=>pt+ih-(v/mx)*ih;
 const bw=stk?Math.max(2,Math.min(44,gw-(gw>8?3:1))):Math.max(3,Math.min(36,(gw-6)/SN-2));

 vintage:{n:'Vintage Curves',d:'Default rate for each weekly batch of loans, measured at 7, 15 and 30 days past due.',f:host=>{

  heat(el,L.amt,L.term,(r,j)=>{const k=r*4+j,v=rates[k],sel=S.amt===r&&S.term===j;return{v:v==null?null:v/top,txt:v==null?'–':(v*100).toFixed(0)+'%',hot:true,sel,dim:(S.amt!=null||S.term!=null)&&!((S.amt==null||S.amt===r)&&(S.term==null||S.term===j)),tip:`<div class="k">${L.amt[r]} · ${L.term[j]}</div><div class="v">${pc(v)}</div><div class="k">${num(c[k][0])} loans matured at 7 days</div>`};},
   {lw:64,ch:56,stops:HEAT,tf:14,click:(r,j)=>{if(S.amt===r&&S.term===j){S.amt=null;S.term=null;}else{S.amt=r;S.term=j;}render();}});

  CSV={head:['Loan size',...L.term],rows:L.amt.map((a,r)=>[a,...L.term.map((t,j)=>pc(rates[r*4+j],0))]),name:CSV.name};}},
 borrower:{n:'Borrower Risk',d:'The first-loan cliff: how default risk drops once a borrower has repaid before. Click a group to filter.',f:host=>{

   {series:[{n:'7-day default',c:css('--s2')},{n:'30-day default',c:css('--s1')}],yFmt:v=>pc(v,0),vFmt:v=>pc(v,v<.1?1:0),values:true,sub:true,h:270,labW:60,click:k=>toggleF('ten',k)});
  table(p2,L.ten,a,t,[{h:'Loans',...I(g=>g.n),heat:'t'},{h:'Default<br>7d %',...P(g=>div(g.d7,g.m7)),heat:'o'},{h:'Default<br>30d %',...P(g=>div(g.d30,g.m30)),heat:'o'},{h:'Arrears<br>principal',...I(g=>g.arrPrin)},{h:'NPL recovery<br>rate %',...P(g=>div(g.nplRec,g.nplRepay))}],'Borrower history');

function vintage(el){
 const w=vw(el),h=300,pl=44,pr=64,pt=12,pb=26,m=mask(['date']),W=Math.ceil(NDAY/7),a=Array.from({length:W},()=>[0,0,0,0,0,0,0]);
 for(let i=0;i<N;i++)if(m[i]){const f=fl[i],o=a[(day[i]/7)|0];o[6]++;if((f>>3)&1){o[0]++;o[1]+=f&1;}if((f>>4)&1){o[2]++;o[3]+=(f>>1)&1;}if((f>>5)&1){o[4]++;o[5]+=(f>>2)&1;}}
 const ser=[{n:'7-day',k:0,c:css('--s1')},{n:'15-day',k:2,c:css('--s2')},{n:'30-day',k:4,c:css('--s3')}];let mxv=0;
 ser.forEach(s=>{s.v=a.map(o=>o[s.k]>=200&&o[s.k]/o[6]>=.9?o[s.k+1]/o[s.k]:null);s.v.forEach(x=>{if(x!=null)mxv=Math.max(mxv,x);});});
 if(!mxv){el.innerHTML=emptyHtml('No cohort is old enough in the current filters.');return;}
 const mx=scale(mxv*1.05).max,iw=w-pl-pr,ih=h-pt-pb,x=i=>pl+iw*(i+.5)/W,y=v=>pt+ih-(v/mx)*ih;let g='';
 ticks(mx).forEach(t=>g+=`<line x1="${pl}" x2="${w-pr}" y1="${y(t)}" y2="${y(t)}" stroke="${css('--grid')}"/><text x="${pl-7}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="${css('--muted')}">${pc(t,0)}</text>`);
 let xl='';for(let i=0;i<W;i+=2)xl+=`<text x="${x(i)}" y="${h-7}" text-anchor="middle" font-size="11" fill="${css('--muted')}">${dFmt(i*7)}</text>`;
 let paths='',dots='',labs=[];ser.forEach(s=>{let d='',pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);pen=true;});
  paths+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s.v.forEach((v,i)=>{if(v!=null)dots+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.c}" stroke="#fff" stroke-width="2"/>`;});let li=-1;s.v.forEach((v,i)=>{if(v!=null)li=i;});if(li>=0)labs.push({y:y(s.v[li]),x:x(li),t:s.n});});
 labs.sort((p,q)=>p.y-q.y);for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<14)labs[i].y=labs[i-1].y+14;
 el.innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" data-live="1"><line x1="${pl}" x2="${w-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="${css('--axis')}"/>${g}${xl}${paths}${dots}${labs.map(l=>`<text x="${l.x+9}" y="${l.y+4}" font-size="12" font-weight="650" fill="${css('--ink')}">${l.t}</text>`).join('')}<line id="vx" y1="${pt}" y2="${pt+ih}" stroke="${css('--ink2')}" visibility="hidden"/><rect id="vo" x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="transparent"/></svg>`+legendHtml(ser.map(s=>({c:s.c,t:s.n+' default',ln:1})));
 const svg=el.querySelector('svg'),ov=svg.querySelector('#vo'),vx=svg.querySelector('#vx');
 ov.addEventListener('pointermove',e=>{const i=Math.max(0,Math.min(W-1,Math.floor((e.clientX-svg.getBoundingClientRect().left-pl)/(iw/W))));vx.setAttribute('x1',x(i));vx.setAttribute('x2',x(i));vx.setAttribute('visibility','visible');
  showTip(`<div class="k">Cohort of ${dFmt(i*7)}</div>`+ser.map(s=>trow(s.c,s.n+' default'+(s.v[i]==null?'':' ('+num(a[i][s.k])+' loans)'),s.v[i]==null?'<span class="k">not yet mature</span>':pc(s.v[i]))).join(''),e.clientX,e.clientY);});
 ov.addEventListener('pointerleave',()=>{vx.setAttribute('visibility','hidden');hideTip();});
 CSV={head:['Cohort week','7-day default','15-day default','30-day default'],rows:a.map((o,i)=>[dFmt(i*7),...ser.map(s=>s.v[i]==null?'':pc(s.v[i]))]),name:CSV.name};
}
/* =============== TABS, KPIs, FILTERS =============== */
const TABS={
 disbursement:{name:'Disbursement',views:dView,order:['breakdown','trend','dist','time','mix'],kpi:()=>{const t=total(mask());return[
  ['Disbursed amount','PKR '+num(t.disb),num(t.n)+' loans'],['Average ticket','PKR '+num(div(t.disb,t.n)||0),'avg term '+(div(t.termSum,t.n)||0).toFixed(1)+' days'],
  ['Margin earned','PKR '+num(t.profit),pc(div(t.profit,t.disb))+' of disbursed'],['Repeat borrowers',pc(div(t.rep,t.n)),num(t.rep)+' loans'],['Disbursed within 3 hours',pc(div(t.fast,t.soldN)),num(t.fast)+' loans']];}},
 recovery:{name:'Recovery',views:rView,order:['breakdown','trend','rate','dist','time','cohort'],kpi:()=>{const t=total(mask());return[
  ['Recovered amount','PKR '+num(t.recDue),num(t.recN)+' loans'],['Recovery rate',pc(div(t.recDue,t.repayDue)),'of PKR '+money(t.repayDue)+' due'],
  ['On-time recovery','PKR '+num(t.timelyAmt),num(t.timelyN)+' loans'],['Late recovery','PKR '+num(t.overAmt),num(t.overN)+' loans'],['NPL recovery','PKR '+num(t.nplRec),num(t.nplClosed)+' NPL loans closed']];}},
 risk:{name:'Default Risk',views:kView,order:['breakdown','aging','vintage','map','borrower'],kpi:()=>{const t=total(mask());return[
  ['7-day default rate',pc(div(t.d7,t.m7)),num(t.m7)+' matured loans'],['30-day default (NPL) rate',pc(div(t.d30,t.m30)),num(t.m30)+' matured loans'],
  ['Principal in arrears','PKR '+num(t.arrPrin),num(t.arrN)+' loans'],['Principal 30+ days late','PKR '+num(t.dpd30Prin),num(t.dpd30N)+' loans'],['NPL recovery rate',pc(div(t.nplRec,t.nplRepay)),'PKR '+money(t.nplRec)+' recovered']];}}
};
const FILTERS=[['term','Term',L.term],['amt','Loan size (PKR)',L.amt],['ten','Borrower',L.ten],['st','Status',L.st],['dpd','Days past due',L.dpd]];
function buildFilters(){
 const el=document.getElementById('filters');
 el.innerHTML=FILTERS.map(([k,l,o])=>`<label class="f">${l}<select id="f-${k}"><option value="">All</option>${o.map((t,i)=>`<option value="${i}">${t}</option>`).join('')}</select></label>`).join('')+
  `<label class="f">Slider<select id="f-slider"><option value="">Any</option><option value="1">Used</option><option value="0">Not used</option></select></label>
   <div class="f">Originated<div class="pair"><input type="date" id="dFrom" aria-label="Originated from"><input type="date" id="dTo" aria-label="Originated to"></div></div>
   <div class="f" id="pf" hidden>Paid date<div class="pair"><input type="date" id="pFrom" aria-label="Paid from"><input type="date" id="pTo" aria-label="Paid to"></div></div>
   <div class="fgrow"><button class="fbtn" id="clr">Clear filters</button><button class="fbtn dl" id="dl" aria-label="Download this table as CSV">Download CSV</button></div>`;
 [...FILTERS.map(f=>f[0]),'slider'].forEach(k=>document.getElementById('f-'+k).onchange=e=>{S[k]=e.target.value===''?null:+e.target.value;render();});
 const dF=document.getElementById('dFrom'),dT=document.getElementById('dTo'),pF=document.getElementById('pFrom'),pT=document.getElementById('pTo');
 dF.min=dT.min=pF.min=pT.min=dIso(0);dF.max=dT.max=dIso(NDAY-1);pF.max=pT.max=dIso(ASOF);
 dF.onchange=()=>{if(dF.value){S.from=Math.max(0,Math.min(isoDay(dF.value),S.to));render();}};
 dT.onchange=()=>{if(dT.value){S.to=Math.min(NDAY-1,Math.max(isoDay(dT.value),S.from));render();}};
 const pset=()=>{const a=pF.value?isoDay(pF.value):0,b=pT.value?isoDay(pT.value):ASOF;if(!pF.value&&!pT.value){S.pfrom=S.pto=null;}else{S.pfrom=Math.min(a,b);S.pto=Math.max(a,b);}render();};
 pF.onchange=pset;pT.onchange=pset;
 document.getElementById('clr').onclick=()=>{S=blank();render();};
 document.getElementById('dl').onclick=downloadCsv;
}
function downloadCsv(){if(!CSV.head.length)return;const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
 const txt=[CSV.head,...CSV.rows].map(r=>r.map(q).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));
 a.download=(CSV.name||'export')+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);}
function syncFilters(){
 FILTERS.forEach(([k])=>document.getElementById('f-'+k).value=S[k]==null?'':S[k]);document.getElementById('f-slider').value=S.slider==null?'':S.slider;
 document.getElementById('dFrom').value=dIso(S.from);document.getElementById('dTo').value=dIso(S.to);
 document.getElementById('pf').hidden=tab!=='recovery';document.getElementById('pFrom').value=S.pfrom==null?'':dIso(S.pfrom);document.getElementById('pTo').value=S.pto==null?'':dIso(S.pto);
}
function renderNav(){
 const T=TABS[tab];document.getElementById('tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="tab" role="tab" data-k="${k}" aria-selected="${k===tab}">${v.name}</button>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.k;try{history.replaceState(null,'','#'+tab+'/'+viewId[tab]);}catch(e){}render();});
 document.getElementById('menu').innerHTML=T.order.map(k=>`<button class="mi" role="tab" data-k="${k}" aria-selected="${k===viewId[tab]}">${T.views[k].n}</button>`).join('');
 document.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{viewId[tab]=b.dataset.k;try{history.replaceState(null,'','#'+tab+'/'+viewId[tab]);}catch(e){}render();});
}
function renderKpis(){document.getElementById('kpis').innerHTML=TABS[tab].kpi().map(k=>`<div class="kg"><div class="kh">${k[0]}</div><div class="kb"><div class="v">${k[1]}</div><div class="v2">${k[2]}</div></div></div>`).join('');}
function renderView(){
 const v=TABS[tab].views[viewId[tab]],host=document.getElementById('view');
 document.getElementById('vt').textContent=v.n;document.getElementById('vd').textContent=v.d;
 CSV={head:[],rows:[],name:(tab+'-'+viewId[tab])};v.f(host);CSV.name=tab+'-'+viewId[tab];
}
let raf=0;
function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{mcache={};hideTip();renderNav();syncFilters();
 const n=mask().reduce((a,b)=>a+b,0);document.getElementById('rowTxt').textContent=num(n)+' of '+num(N)+' loans in view';renderKpis();renderView();});}
function readHash(){try{const h=location.hash.slice(1).split('/');if(TABS[h[0]]){tab=h[0];if(h[1]&&TABS[tab].views[h[1]])viewId[tab]=h[1];}}catch(e){}}
readHash();addEventListener('hashchange',()=>{readHash();render();});
buildFilters();
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,120);});
render();
})();
</script>
